<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Aryan Sarkar (26PHMP54), University of Hyderabad">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>UoH Lab Experiments</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a bench page. Instruments + breadboard scene on the left, the step card on the right;
   the live CRO below. Utility/instrument feel; PCB green as accent, amber marks "do this now". */
:root{
  --bg:#e6ebe7;          /* bench paint, cool green-grey */
  --surface:#f6f8f6;
  --surface-2:#dde4df;
  --ink:#16201b;
  --ink-2:#4b5952;
  --ink-3:#77857d;
  --line:#c3cdc6;
  --accent:#0d6e4a;      /* PCB solder-mask green */
  --accent-soft:#cfe6da;
  --accent-ink:#ffffff;
  --amber:#b56a00;       /* "do this now" highlight */
  --amber-soft:#f6e3c2;
  --danger:#b3261e;
  --danger-soft:#f6d9d6;
  --ok:#1d7a3a;
  /* objects on the bench (physical colours, toned per theme) */
  --bb:#f4f3ee; --bb-edge:#d3d1c6; --bb-hole:#3b3e3b; --bb-gap:#e2e0d7;
  --inst:#e3e0d5; --inst-edge:#b9b5a8; --inst-face:#d4d0c3; --panel-blue:#bcd3e3; --lcd:#1a2a22; --lcd-ink:#7dffa8;
  --scope-bg:#07120d; --phos:#8dff9b; --ch2:#7fd3ff; --grat:#2f6b4b;
  --wire-red:#d42a2a; --wire-black:#232323; --wire-blue:#1f5fd1; --wire-yellow:#e2b100; --wire-green:#1b9a4a; --wire-orange:#e86a12; --wire-white:#e8e8e8; --wire-violet:#7b4bd0;
  --f-display:"Chakra Petch", "Bahnschrift", "Segoe UI", sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311; --surface:#161d19; --surface-2:#1e2722; --ink:#e2eae5; --ink-2:#a2b0a8; --ink-3:#74827a; --line:#2c3832;
    --accent:#47cf92; --accent-soft:#173a2a; --accent-ink:#04110b; --amber:#f0a43a; --amber-soft:#3a2a10; --danger:#ff8a80; --danger-soft:#3b1c1a; --ok:#6fdc8f;
    --bb:#d8d7cf; --bb-edge:#a9a79c; --bb-hole:#2b2d2b; --bb-gap:#c4c2b8;
    --inst:#c3c0b5; --inst-edge:#8f8b7f; --inst-face:#b4b0a3; --panel-blue:#9fb8ca; --lcd:#0b1510; --lcd-ink:#7dffa8;
    --wire-black:#3a3a3a; --wire-white:#d0d0d0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#161d19; --surface-2:#1e2722; --ink:#e2eae5; --ink-2:#a2b0a8; --ink-3:#74827a; --line:#2c3832;
  --accent:#47cf92; --accent-soft:#173a2a; --accent-ink:#04110b; --amber:#f0a43a; --amber-soft:#3a2a10; --danger:#ff8a80; --danger-soft:#3b1c1a; --ok:#6fdc8f;
  --bb:#d8d7cf; --bb-edge:#a9a79c; --bb-hole:#2b2d2b; --bb-gap:#c4c2b8;
  --inst:#c3c0b5; --inst-edge:#8f8b7f; --inst-face:#b4b0a3; --panel-blue:#9fb8ca; --lcd:#0b1510; --lcd-ink:#7dffa8;
  --wire-black:#3a3a3a; --wire-white:#d0d0d0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,1.2rem + 2vw,2.6rem);letter-spacing:-.01em}
h2{font-size:clamp(1.3rem,1.1rem + .8vw,1.7rem)}
h3{font-size:1.08rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
kbd{font-family:var(--f-mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .3em;background:var(--surface)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:54px;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:1.02rem;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;justify-content:flex-end}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--ink-2);font-size:.88rem;padding:6px 10px;border-radius:999px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .n{font-family:var(--f-mono);font-size:.78rem;opacity:.75;margin-right:4px}
@media (max-width:760px){.brand span{display:none}}

/* ---------- home ---------- */
.home-hero{padding-block:36px 18px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.home-hero p.lede{font-size:1.1rem;color:var(--ink-2);max-width:58ch;margin-top:12px}
.home-hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero-scope{background:var(--scope-bg);border-radius:14px;padding:14px;border:6px solid var(--inst);box-shadow:0 1px 0 var(--inst-edge)}
.hero-scope canvas{width:100%;display:block;aspect-ratio:10/8;max-width:100%}
@media (max-width:820px){.home-hero{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:700;font-size:.95rem;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.exp-list{display:grid;gap:12px;padding-block:8px 40px}
.exp-row{display:grid;grid-template-columns:64px minmax(0,1fr) 220px;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-decoration:none;color:var(--ink);transition:border-color .15s, transform .15s}
.exp-row:hover{border-color:var(--accent);transform:translateY(-1px)}
.exp-row .num{font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--accent);line-height:1}
.exp-row h3{font-size:1.2rem}
.exp-row p{color:var(--ink-2);font-size:.95rem;margin-top:4px}
.exp-row .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.exp-row canvas{width:100%;height:64px;background:var(--scope-bg);border-radius:6px;display:block}
@media (max-width:700px){.exp-row{grid-template-columns:44px minmax(0,1fr)}.exp-row canvas{grid-column:1/-1}.exp-row .num{font-size:1.7rem}}
.bench-row{border-style:dashed}

/* ---------- experiment page ---------- */
.exp-head{padding-block:26px 8px;display:grid;gap:10px}
.exp-head .aim{color:var(--ink-2);max-width:75ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.9rem;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:4px}
.subnav a{white-space:nowrap;text-decoration:none;color:var(--ink-2);padding:7px 10px;font-size:.88rem;border-radius:6px}
.subnav a:hover{color:var(--ink);background:var(--surface-2)}
.sec{padding-block:26px 8px;scroll-margin-top:110px}
.sec > header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec > header p{color:var(--ink-2)}

/* kit */
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.kit-item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kit-item svg{width:72px;height:44px}
.kit-item b{display:block;font-size:.95rem}
.kit-item span{font-size:.84rem;color:var(--ink-2);display:block}
.kit-item .qty{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}

/* wiring scene */
.wire-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:1020px){.wire-grid{grid-template-columns:1fr}}
.scene-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.scene-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.scene-tools .sp{flex:1}
.scene-tools .hint{font-size:.8rem;color:var(--ink-3)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.scene{display:block;width:100%;height:auto;aspect-ratio:1200/760;max-width:100%;background:var(--surface-2);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.scene .hole{fill:var(--bb-hole)}
.scene .hole.hl{fill:var(--amber)}
.scene .hit{fill:transparent;cursor:pointer}
.scene .part{transition:opacity .25s}
.scene .part.future{display:none}
.scene .part.new .glow{stroke:var(--amber);stroke-opacity:.55;fill:none;animation:pulse 1.4s ease-in-out infinite}
.scene .part.dim{opacity:.55}
.scene .callout rect{fill:var(--ink);}
.scene .callout text{fill:var(--bg);font-family:var(--f-body);font-weight:700}
.scene .callout line{stroke:var(--ink)}
.scene .lbl{font-family:var(--f-mono);fill:#4a4a44}
.scene .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{stroke-opacity:.15}50%{stroke-opacity:.75}}
@media (prefers-reduced-motion:reduce){.scene .draw{animation:none;stroke-dashoffset:0}.scene .part.new .glow{animation:none;stroke-opacity:.6}}
.node-tip{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--ink);color:var(--bg);font-size:.82rem;padding:6px 10px;border-radius:6px;pointer-events:none}

.stepcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;touch-action:pan-y}
@media (min-width:1021px){.stepcard{position:sticky;top:120px;max-height:calc(100vh - 140px)}}
.step-top{padding:14px 16px 0}
.step-count{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.progress{height:4px;background:var(--surface-2);border-radius:4px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.step-body{padding:12px 16px 14px;display:grid;gap:10px}
.step-body h3{font-size:1.25rem}
.step-body .txt{color:var(--ink)}
.step-body .check{font-size:.9rem;border-radius:8px;padding:8px 10px;background:var(--accent-soft)}
.step-body .warn{font-size:.9rem;border-radius:8px;padding:8px 10px;background:var(--danger-soft)}
.step-body .check b,.step-body .warn b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;display:block}
.step-nav{display:flex;gap:8px;padding:0 16px 12px}
.step-nav .btn{flex:1;justify-content:center}
.step-list{border-top:1px solid var(--line);overflow:auto;padding:6px 8px 10px;max-height:280px}
@media (min-width:1021px){.step-list{max-height:none;flex:1}}
.step-list ol{list-style:none;margin:0;padding:0;counter-reset:s}
.step-list li button{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:.88rem;color:var(--ink-2)}
.step-list li button:hover{background:var(--surface-2)}
.step-list li button .i{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
.step-list li.done button{color:var(--ink-3)}
.step-list li.done button .i::after{content:" ✓";color:var(--accent)}
.step-list li.cur button{background:var(--amber-soft);color:var(--ink);font-weight:700}
.swipe-hint{font-size:.78rem;color:var(--ink-3);padding:0 16px 10px}

/* observe */
.obs-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.obs-grid{grid-template-columns:1fr}}
.cro{background:var(--inst);border:1px solid var(--inst-edge);border-radius:14px;padding:12px;display:grid;gap:10px;color:#22251f}
.cro-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.06em;color:#3a3d35}
.cro-screen{position:relative;background:var(--scope-bg);border-radius:10px;padding:8px;border:4px solid #2a2d27}
.cro-screen canvas{display:block;width:100%;aspect-ratio:10/8;max-width:100%}
.cro-read{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.72rem;color:#b6f5c0;pointer-events:none}
.cro-read .c2{color:var(--ch2)}
.cro-ctrl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.cro-ctrl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cgroup{background:var(--inst-face);border-radius:8px;padding:8px;display:grid;gap:6px;align-content:start}
.cgroup h4{margin:0;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#3d4138}
.cgroup.ch1 h4{color:#1f6a35}.cgroup.ch2 h4{color:#1d5d86}
.knob{display:grid;justify-items:center;gap:2px}
.knob svg{width:56px;height:56px;cursor:grab;touch-action:none}
.knob .kv{font-family:var(--f-mono);font-size:.78rem;font-weight:600;color:#1d201b}
.knob .kb{display:flex;gap:4px}
.knob .kb button{width:28px;height:26px;border-radius:6px;border:1px solid #9d998c;background:#f3f1ea;cursor:pointer;font-weight:700;line-height:1;color:#22251f}
.tog{display:flex;border:1px solid #9d998c;border-radius:6px;overflow:hidden}
.tog button{flex:1;border:0;background:#f3f1ea;padding:4px 0;font-family:var(--f-mono);font-size:.7rem;cursor:pointer;color:#22251f}
.tog button[aria-pressed="true"]{background:#2b2f27;color:#d6ffd9}
.cgroup input[type=range]{width:100%;accent-color:#2b2f27}
.cgroup label{font-family:var(--f-mono);font-size:.68rem;color:#3d4138}
.fg{background:var(--inst);border:1px solid var(--inst-edge);border-radius:14px;padding:12px;display:grid;gap:10px;color:#22251f}
.fg-disp{background:var(--lcd);color:var(--lcd-ink);font-family:var(--f-mono);font-size:1.4rem;padding:6px 12px;border-radius:6px;text-align:right;letter-spacing:.04em}
.fg-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:460px){.fg-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.side{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.panel h3{font-size:1rem}
.ctrl-row{display:grid;gap:4px}
.ctrl-row > span{font-size:.84rem;color:var(--ink-2)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:7px;cursor:pointer;font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2)}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.readouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ro{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.ro .k{font-size:.76rem;color:var(--ink-2);display:block}
.ro .v{font-family:var(--f-mono);font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.ro.hl{background:var(--accent-soft)}
.howread{font-size:.86rem;color:var(--ink-2);display:grid;gap:4px}
.howread .mono{color:var(--ink)}
.dmm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.dmm-face{background:#1d6fb8;border-radius:12px;padding:8px;width:128px}
.dmm-lcd{background:#c5d3b5;border-radius:4px;padding:6px 8px;font-family:var(--f-mono);font-size:1.25rem;color:#1c2416;text-align:right;font-weight:600}
.dmm-face small{display:block;color:#e6f0ff;font-family:var(--f-mono);font-size:.65rem;text-align:center;margin-top:4px}

/* recorder */
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.rec-grid{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:420px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);position:sticky;top:0;background:var(--surface)}
td{font-family:var(--f-mono)}
td:first-child,th:first-child{text-align:left}
.plot-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.plot-box svg{width:100%;height:auto;display:block}
.plot-box .ax{stroke:var(--ink-3);stroke-width:1}
.plot-box .gr{stroke:var(--line);stroke-width:1}
.plot-box text{fill:var(--ink-2);font-family:var(--f-mono);font-size:11px}
.plot-box .curve{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:4 4}
.plot-box .meas{fill:none;stroke:var(--accent);stroke-width:2.2}
.plot-box .pt{fill:var(--accent)}
.plot-box .ref{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:6 4}
.plot-box .reft{fill:var(--amber)}
.empty{padding:22px;text-align:center;color:var(--ink-3);font-size:.9rem}

/* theory */
.theory{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.theory{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.tcard p,.tcard li{max-width:68ch}
.tcard ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.eq{font-family:var(--f-mono);background:var(--surface-2);padding:8px 12px;border-radius:6px;overflow-x:auto;white-space:nowrap;font-size:.95rem}
.chain{font-family:var(--f-body);display:grid;gap:2px;padding:8px 12px;border-radius:6px;background:var(--surface-2)}
.chain .ar{color:var(--accent);font-weight:700;padding-left:6px}
.chain .why{color:var(--ink-2);font-size:.88rem}
.tcard svg{width:100%;height:auto;display:block}
details.viva{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.viva + details.viva{margin-top:8px}
details.viva summary{cursor:pointer;font-weight:700}
details.viva p{margin-top:6px;color:var(--ink-2)}
.mistakes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mist{background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;position:relative;overflow:hidden}
.mist::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--danger)}
.mist b{font-size:.95rem}
.mist span{font-size:.88rem;color:var(--ink-2)}
.foot{padding-block:30px 50px;color:var(--ink-3);font-size:.85rem}

/* bench tour */
.tour-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.tour-grid{grid-template-columns:1fr}}
.bbonly{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:8px}
.cc-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cc-row select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pin-tbl td,.pin-tbl th{text-align:left}
.lesson{display:grid;gap:8px}
.lesson ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.92rem}
.task .st{font-family:var(--f-mono);font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--line);white-space:nowrap}
.task.ok .st{background:var(--accent);color:var(--accent-ink)}
</style>

<script>
/* =====================================================================

   ===================================================================== */
"use strict";
const NS = "http://www.w3.org/2000/svg";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function H(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);

  return el;
}
function S(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag);

    else el.setAttribute(k, v);

  for (const c of kids.flat()) if (c) el.append(c);
  return el;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const store = {
  get(k, d) { try { const v = localStorage.getItem("labwalk:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("labwalk:" + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- number formatting ---------- */
function eng(v, unit, digits = 3) {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  const P = [[1e6, "M"], [1e3, "k"], [1, ""], [1e-3, "m"], [1e-6, "µ"], [1e-9, "n"], [1e-12, "p"]];
  if (a === 0) return "0 " + unit;
  for (const [m, p] of P) if (a >= m * 0.9995) return trimNum(v / m, digits) + " " + p + unit;
  return trimNum(v / 1e-12, digits) + " p" + unit;
}
function trimNum(x, digits) {
  const a = Math.abs(x);
  let d = a >= 100 ? 0 : a >= 10 ? 1 : 2;
  if (digits === 2) d = Math.max(0, d - 1);
  let s = x.toFixed(d);
  if (s.includes(".")) s = s.replace(/\.?0+$/, "");
  return s;
}
const fV = v => eng(v, "V");
const fHz = v => eng(v, "Hz");
const fs = v => eng(v, "s");
function fR(v) { return eng(v, "Ω"); }
function fC(c) {
  if (c >= 1e-6) return trimNum(c * 1e6, 3) + " µF";
  if (c >= 1e-9 * 0.999 && c < 1e-6) { // lab convention: 0.01 µF, 0.002 µF
    const u = c * 1e6;
    return (+u.toPrecision(2)).toString() + " µF";
  }
  return trimNum(c * 1e12, 3) + " pF";
}
function capCode(c) { // 103 = 10 x 10^3 pF
  const pf = c * 1e12;
  if (pf < 10) return trimNum(pf, 2) + "p";
  const e = Math.floor(Math.log10(pf)) - 1;
  const m = Math.round(pf / Math.pow(10, e));
  return "" + m + e;
}

/* ---------- resistor colour code ---------- */
const BAND = [["#1b1b1b", "black"], ["#7a4a24", "brown"], ["#d32222", "red"], ["#f07a10", "orange"], ["#f2d21a", "yellow"], ["#1f9a3e", "green"], ["#1f5fd1", "blue"], ["#8a4fd0", "violet"], ["#8e8e8e", "grey"], ["#f7f7f7", "white"]];
const GOLD = ["#c8a23a", "gold"];
function bandsFor(R) {
  let e = Math.floor(Math.log10(R)) - 1;
  let m = Math.round(R / Math.pow(10, e));
  if (m >= 100) { m = Math.round(m / 10); e += 1; }
  const d1 = Math.floor(m / 10), d2 = m % 10;
  const mult = e >= 0 ? BAND[e] : GOLD;
  return [BAND[d1], BAND[d2], mult, GOLD];
}

/* ---------- breadboard geometry ---------- */
const BB = { cols: 40, x0: 125, px: 25 };
const ROWY = { TP: 355, TN: 378, a: 420, b: 444, c: 468, d: 492, e: 516, f: 564, g: 588, h: 612, i: 636, j: 660, BN: 702, BP: 725 };
const RAILS = ["TP", "TN", "BN", "BP"];
const colX = c => BB.x0 + (c - 1) * BB.px;
function parseHole(a) {
  const m = /^(TP|TN|BN|BP|[a-j])(\d+)$/.exec(a);
  if (!m) throw new Error("bad hole " + a);
  return { row: m[1], col: +m[2] };
}
function holeXY(a) { const p = parseHole(a); return { x: colX(p.col), y: ROWY[p.row] }; }
function stripOf(a) {
  const p = parseHole(a);
  if (RAILS.includes(p.row)) return p.row;
  return ("abcde".includes(p.row) ? "T" : "B") + p.col;
}
function stripHoles(key) {
  const out = [];
  if (RAILS.includes(key)) { for (let c = 1; c <= BB.cols; c++) out.push(key + c); return out; }
  const top = key[0] === "T", col = +key.slice(1);
  for (const r of (top ? "abcde" : "fghij")) out.push(r + col);
  return out;
}
function stripName(key) {
  if (RAILS.includes(key)) return { TP: "top outer rail", TN: "top inner rail", BN: "bottom inner rail", BP: "bottom outer rail" }[key];
  return "column " + key.slice(1) + (key[0] === "T" ? " (rows a–e)" : " (rows f–j)");
}

/* ---------- instruments (drawn in the scene) ---------- */
const SLOTS = { left: { x: 14, y: 26, w: 272, h: 236 }, dc: { x: 302, y: 26, w: 276, h: 236 }, cro: { x: 594, y: 26, w: 330, h: 236 }, dmm: { x: 940, y: 26, w: 246, h: 236 } };
const TERM = {};
function terminal(g, id, x, y, color, label, r = 11) {
  TERM[id] = { x, y };
  g.append(S("circle", { cx: x, cy: y, r: r + 3, fill: "#2a2a2a", opacity: ".25" }));
  g.append(S("circle", { cx: x, cy: y, r, fill: color, stroke: "#00000055" }));
  g.append(S("circle", { cx: x, cy: y, r: r * 0.38, fill: "#111" }));
  if (label) g.append(S("text", { x, y: y + r + 15, "text-anchor": "middle", "font-size": 12, "font-weight": 700, "font-family": "IBM Plex Mono, monospace", fill: "#2b2d27", text: label }));
}
function bnc(g, id, x, y, label) {
  TERM[id] = { x, y };

const INST = {
  ac(g) {

    ["1", "10", "100", "1k", "10k", "100k", "1M"].forEach((r, i) => { g.append(S("rect", { x: s.x + 12 + i * 36, y: s.y + 90, width: 30, height: 16, rx: 3, fill: "#f3f1ea", stroke: "#9d998c" })); g.append(S("text", { x: s.x + 27 + i * 36, y: s.y + 102, "text-anchor": "middle", "font-size": 9, "font-family": "IBM Plex Mono, monospace", fill: "#222", text: "×" + r })); });

    g.append(S("text", { x: s.x + s.w / 2, y: s.y + 232, "text-anchor": "middle", "font-size": 9, "font-family": "IBM Plex Mono, monospace", fill: "#e6f0ff", text: "DIGITAL MULTIMETER" }));
  }
};

  vcc(x, y, s) { this.w([x, y], [x, y - 10]); this.p(`M${x - 8} ${y - 10} L${x + 8} ${y - 10}`); this.t(x, y - 15, s); return this; }
  src(x, y, s) { this.g.append(S("circle", { cx: x, cy: y, r: 15, style: "fill:var(--surface)" })); this.p(`M${x - 8} ${y} q 4 -9 8 0 t 8 0`); if (s) this.t(x - 22, y + 4, s, "end"); return this; }
  npn(x, y, s, mir) { // base lead ends at (x,y); collector (x±24,y-30), emitter (x±24,y+30); mir = body to the left
    const k = mir ? -1 : 1, X = d => x + k * d;
    this.g.append(S("circle", { cx: X(16), cy: y, r: 19, style: "fill:var(--surface)" }));
    this.w([x, y], [X(9), y]); this.p(`M${X(9)} ${y - 11} L${X(9)} ${y + 11}`);
    this.w([X(9), y - 5], [X(24), y - 16], [X(24), y - 30]);
    this.w([X(9), y + 5], [X(24), y + 16], [X(24), y + 30]);
    this.p(`M${X(24)} ${y + 16} L${X(16)} ${y + 15} L${X(20)} ${y + 9} Z`, { style: "fill:var(--ink)" });
    if (s) this.t(X(40), y + 4, s, mir ? "end" : "start");
    return this;
  }
  opamp(x, y) { // inverting input (x,y-16), non-inverting (x,y+16), output (x+70,y)
    this.p(`M${x + 10} ${y - 34} L${x + 10} ${y + 34} L${x + 66} ${y} Z`, { style: "fill:var(--surface)" });
    this.w([x, y - 16], [x + 10, y - 16]); this.w([x, y + 16], [x + 10, y + 16]); this.w([x + 66, y], [x + 70, y]);
    this.t(x + 18, y - 12, "−", "middle"); this.t(x + 18, y + 20, "+", "middle");
    this.t(x + 30, y - 28, "741", "start");
    return this;
  }
  xfmr(x, y, ct) { // primary coil left at x, secondary right at x+40, top y, height 80
    for (let i = 0; i < 4; i++) { this.p(`M${x} ${y + i * 20} a10 10 0 0 1 0 20`); this.p(`M${x + 40} ${y + i * 20} a10 10 0 0 0 0 20`); }
    this.p(`M${x + 16} ${y} L${x + 16} ${y + 80} M${x + 24} ${y} L${x + 24} ${y + 80}`);
    this.t(x + 52, y - 4, "A", "start"); this.t(x + 52, y + 92, "B", "start");
    if (ct) this.t(x + 52, y + 44, "CT", "start");
    return this;
  }
  done(label) { this.svg.setAttribute("aria-label", label); return this.svg; }
}

const SCH = {
  hw(p) {
    const s = new Sch(470, 180);
    s.xfmr(40, 40, false); s.t(28, 84, "230 V", "end");
    s.w([80, 40], [130, 40]); s.D(130, 40, 210, 40, "1N4007", -1); s.w([210, 40], [380, 40]); s.dot(300, 40);

  ct(p) {

  },
  bridge(p, zen) {

    s.D(L[0], L[1], B[0], B[1], "D4", -1); s.D(B[0], B[1], R[0], R[1], "D2", 1);
    [T, B, L, R].forEach(q => s.dot(q[0], q[1]));
    s.t(262, 114, "+", "start"); s.t(140, 114, "−", "end");
    s.w(R, [275, 120], [275, 40], [320, 40]); s.w(L, [130, 120], [130, 215], [320, 215]); s.gnd(130, 215);

    else {
      s.R(320, 40, 420, 40, "Rs " + fR(p.Rs || 68), -1); s.dot(420, 40); s.w([420, 40], [500, 40]);

  },
  osc(p) {
    const s = new Sch(600, 262);
    s.vcc(120, 30, "+10 V"); s.vcc(200, 30, "+10 V");
    s.R(120, 30, 120, 120, "RB1 18k", -1); s.R(120, 120, 120, 220, "RB2 4.7k", -1); s.gnd(120, 220);
    s.dot(120, 120); s.w([120, 120], [152, 120]); s.npn(152, 120, "");
    s.R(200, 30, 200, 90, "RC 1.2k"); s.w([176, 90], [200, 90]); s.w([176, 150], [176, 170]);
    s.R(176, 170, 176, 230, "RE", -1); s.C(214, 170, 214, 230, "CE", 1, true); s.w([176, 170], [214, 170]); s.w([176, 230], [214, 230]); s.gnd(195, 230);
    s.dot(200, 90); s.w([200, 90], [250, 90]);
    const x = 250, c = fC(p.C);

  },
  ce(p) {

  },
  _pair(s, labs) { // Q1 mirrored on the left (base at 120,180), Q2 normal on the right (base at 440,180)
    s.w([76, 20], [484, 20]); s.t(280, 13, "+10 V");
    s.w([96, 20], [96, 30]); s.R(96, 30, 96, 110, "Rc1 2.2k", -1); s.w([96, 110], [96, 150]);
    s.w([464, 20], [464, 30]); s.R(464, 30, 464, 110, "Rc2 2.2k", 1); s.w([464, 110], [464, 150]);

  astable(p) {
    const s = new Sch(560, 240); SCH._pair(s);
    s.w([200, 20], [200, 30]); s.R(200, 30, 200, 100, "R1", -1); s.w([200, 100], [200, 180], [120, 180]);
    s.w([360, 20], [360, 30]); s.R(360, 30, 360, 100, "R2", 1); s.w([360, 100], [360, 180], [440, 180]);
    s.dot(200, 165); s.dot(360, 165);
    s.C(96, 130, 360, 165, "", 1); s.C(464, 130, 200, 165, "", 1);

    s.t(280, 232, "R1 = R2 = " + fR(p.R1) + " · C1 = C2 = " + fC(p.C1));

  mono(p) {
    const s = new Sch(560, 320); SCH._pair(s);
    s.w([360, 20], [360, 30]); s.R(360, 30, 360, 100, "R " + fR(p.R), 1); s.w([360, 100], [360, 180], [440, 180]); s.dot(360, 150);
    s.C(96, 130, 360, 150, "", 1); s.t(160, 124, "C " + fC(p.C));
    s.R(464, 130, 200, 150, "", 1); s.t(400, 124, "15k"); s.w([200, 150], [200, 180], [120, 180]); s.dot(160, 180);
    s.R(160, 180, 160, 250, "47k", -1); s.gnd(160, 250);

  bistable(p) {

    s.R(96, 130, 360, 150, "", 1); s.t(150, 124, "15k"); s.w([360, 150], [360, 180], [440, 180]);
    s.R(464, 130, 200, 150, "", 1); s.t(410, 124, "15k"); s.w([200, 150], [200, 180], [120, 180]);
    s.dot(160, 180); s.R(160, 180, 160, 260, "47k", -1); s.gnd(160, 260);
    s.dot(400, 180); s.R(400, 180, 400, 260, "47k", 1); s.gnd(400, 260);
    s.dot(200, 180); s.dot(360, 180);
    s.D(200, 180, 280, 240, "", 1); s.D(360, 180, 280, 240, "", 1); s.dot(280, 240); s.t(280, 204, "1N4148");
    s.R(280, 240, 220, 240, "Rt 47k", -1); s.gnd(220, 240);

  opamp(p) {
    const m = p.mode, s = new Sch(520, 290);
    const X = 240, Y = 130; s.opamp(X, Y);
    s.t(X + 40, Y - 44, "+10 V → pin 7", "start"); s.t(X + 40, Y + 54, "−10 V → pin 4", "start");
    s.w([X + 70, Y], [440, Y]); s.dot(400, Y); s.T(474, Y + 4, "Vout");
    const N = [210, Y - 16];
    const fb = (kind, lab) => { s.w(N, [210, 56]); if (kind === "R") s.R(210, 56, 400, 56, lab, -1); else if (kind === "C") s.C(210, 56, 400, 56, lab, -1); else s.w([210, 56], [400, 56]); s.w([400, 56], [400, Y]); s.dot(N[0], N[1]); };
    const rcomp = lab => { s.w([X, Y + 16], [222, Y + 16], [222, Y + 40]); if (lab) { s.R(222, Y + 40, 222, Y + 100, lab, 1); s.gnd(222, Y + 100); } else s.gnd(222, Y + 40); };
    if (["inv", "sum", "integ", "diff"].includes(m)) {
      s.src(60, Y + 30, "FG"); s.w([60, Y + 15], [60, N[1]]); s.w([60, Y + 45], [60, Y + 60]); s.gnd(60, Y + 60);
      if (m === "diff") s.C(60, N[1], 210, N[1], "C " + fC(p.C), -1); else s.R(60, N[1], 210, N[1], (m === "sum" ? "R1 " : "Rin ") + fR(p.Rin), -1);
      s.w(N, [X, N[1]]);
      if (m === "integ") { fb("C", "C " + fC(p.C)); s.w([210, 56], [210, 24]); s.R(210, 24, 400, 24, "Rf " + fR(p.Rf), -1); s.w([400, 24], [400, 56]); }
      else fb("R", "Rf " + fR(p.Rf));
      if (m === "sum") { s.R(100, 86, 210, 86, "R2 10k", -1); s.dot(210, 86); s.t(94, 90, "V2", "end"); s.t(94, 104, "0.83 V DC", "end"); rcomp(null); }
      else rcomp("Rcomp " + fR(p.Rcomp));
    } else if (m === "noninv" || m === "buffer") {
      s.src(60, Y + 70, "FG"); s.w([60, Y + 55], [60, Y + 16], [X, Y + 16]); s.w([60, Y + 85], [60, Y + 100]); s.gnd(60, Y + 100);
      s.w(N, [X, N[1]]);
      if (m === "noninv") { fb("R", "Rf " + fR(p.Rf)); s.R(210, N[1], 130, N[1], "R1 " + fR(p.Rin), -1); s.gnd(130, N[1]); }
      else fb("W");
    } else if (m === "diffamp") {
      s.src(40, 240, "FG"); s.w([40, 225], [40, 200], [60, 200]); s.w([40, 255], [40, 268]); s.gnd(40, 268); s.dot(60, 200); s.T(66, 216, "V1", "start");
      s.R(60, 200, 200, 200, "R3 10k", 1); s.w([200, 200], [200, Y + 16], [X, Y + 16]); s.dot(225, Y + 16); s.R(225, Y + 16, 225, Y + 76, "R4", 1); s.gnd(225, Y + 76);
      s.w([60, 200], [60, N[1]]); s.R(60, N[1], 130, N[1], "10k", -1); s.dot(130, N[1]); s.R(130, N[1], 130, Y + 30, "10k", -1); s.gnd(130, Y + 30); s.T(130, N[1] - 20, "V2"); 
      s.R(130, N[1], 210, N[1], "R2", 1); s.w(N, [X, N[1]]); fb("R", "Rf 10k");
    }
    return s.done("741 circuit schematic");
  }
};

function kitIcon(kind, v) {
  const s = S("svg", { viewBox: "0 0 72 44", "aria-hidden": "true" });
  const leg = (x1, y1, x2, y2) => s.append(S("line", { x1, y1, x2, y2, stroke: "#9da0a3", "stroke-width": 2 }));
  if (kind === "res") {
    leg(2, 22, 70, 22); s.append(S("rect", { x: 18, y: 15, width: 36, height: 14, rx: 6, fill: "#e6cf9f", stroke: "#a98d57" }));
    bandsFor(v).forEach((b, i) => s.append(S("rect", { x: [23, 29, 35, 47][i], y: 15, width: 3.6, height: 14, fill: b[0] })));
  } else if (kind === "diode" || kind === "sig" || kind === "zener") {
    leg(2, 22, 70, 22);
    if (kind === "diode") { s.append(S("rect", { x: 22, y: 15, width: 28, height: 14, rx: 3, fill: "#1f1f1f" })); s.append(S("rect", { x: 42, y: 15, width: 4, height: 14, fill: "#cfd3d6" })); }
    else { s.append(S("rect", { x: 24, y: 17, width: 24, height: 10, rx: 4, fill: "#e8704a" })); s.append(S("rect", { x: 42, y: 17, width: 3, height: 10, fill: "#111" })); }
  } else if (kind === "disc") {
    leg(30, 40, 33, 24); leg(42, 40, 39, 24); s.append(S("circle", { cx: 36, cy: 18, r: 14, fill: "#d9822b", stroke: "#9b5714" }));
    s.append(S("text", { x: 36, y: 22, "text-anchor": "middle", "font-size": 10, "font-weight": 700, "font-family": "IBM Plex Mono, monospace", fill: "#2b1606", text: capCode(v) }));
  } else if (kind === "ecap") {
    leg(32, 34, 32, 43); leg(40, 34, 40, 43); s.append(S("rect", { x: 24, y: 3, width: 24, height: 32, rx: 4, fill: "#23466e" }));
    s.append(S("rect", { x: 40, y: 3, width: 6, height: 32, fill: "#b9c8d8" })); s.append(S("text", { x: 43, y: 22, "text-anchor": "middle", "font-size": 9, "font-weight": 700, fill: "#0f2440", text: "−" }));
  } else if (kind === "bjt") {
    leg(28, 30, 28, 43); leg(36, 30, 36, 43); leg(44, 30, 44, 43);
    s.append(S("rect", { x: 22, y: 6, width: 28, height: 24, rx: 4, fill: "#c9ced2", stroke: "#7f868b" }));
    s.append(S("rect", { x: 16, y: 24, width: 8, height: 5, fill: "#a3a9ad" }));
    s.append(S("text", { x: 27, y: 42, "font-size": 7, fill: "#666", text: "" }));
  } else if (kind === "ic") {
    for (let i = 0; i < 4; i++) { leg(22 + i * 9, 4, 22 + i * 9, 10); leg(22 + i * 9, 34, 22 + i * 9, 40); }
    s.append(S("rect", { x: 16, y: 10, width: 40, height: 24, rx: 2, fill: "#222426" })); s.append(S("path", { d: "M16 17 a5 5 0 0 1 0 10", fill: "#4a4d50" }));
    s.append(S("text", { x: 38, y: 26, "text-anchor": "middle", "font-size": 8, "font-weight": 700, fill: "#ddd", "font-family": "IBM Plex Mono, monospace", text: "741" }));
  } else if (kind === "wire") {
    ["#d42a2a", "#232323", "#e2b100", "#1b9a4a"].forEach((c, i) => s.append(S("path", { d: `M6 ${8 + i * 9} Q 36 ${2 + i * 9} 66 ${10 + i * 9}`, stroke: c, "stroke-width": 3.5, fill: "none", "stroke-linecap": "round" })));
  } else if (kind === "bb") {
    s.append(S("rect", { x: 4, y: 6, width: 64, height: 32, rx: 3, fill: "#f4f3ee", stroke: "#bbb" }));
    for (let i = 0; i < 12; i++) for (let j = 0; j < 4; j++) s.append(S("rect", { x: 9 + i * 5, y: 11 + j * 6 + (j > 1 ? 4 : 0), width: 2.2, height: 2.2, fill: "#555" }));
  } else { // instrument
    const col = { ac: "#f2f1ec", dc: "#bcd3e3", fg: "#e3e0d5", cro: "#e3e0d5", dmm: "#1d6fb8" }[kind] || "#ddd";
    s.append(S("rect", { x: 8, y: 6, width: 56, height: 32, rx: 5, fill: col, stroke: "#8f8b7f" }));
    if (kind === "cro") { s.append(S("rect", { x: 13, y: 10, width: 24, height: 20, rx: 2, fill: "#0b1a12" })); s.append(S("path", { d: "M14 22 q 5 -10 10 0 t 10 0", stroke: "#8dff9b", fill: "none" })); }
    if (kind === "dc" || kind === "fg") { s.append(S("rect", { x: 13, y: 11, width: 26, height: 9, fill: "#1a2a22" })); }
    if (kind === "dmm") s.append(S("rect", { x: 20, y: 10, width: 32, height: 10, fill: "#c5d3b5" }));
    [["#d42a2a", 50], ["#222", 58]].forEach(([c, x]) => s.append(S("circle", { cx: x - 4, cy: 30, r: 3.4, fill: c })));
  }
  return s;
}

const Ld = (id, from, to, color, o) => Object.assign({ id, type: "lead", from, to, color }, o);
const Wr = (id, a, b, color, o) => Object.assign({ id, type: "wire", a, b, color }, o);
const Rs_ = (id, a, b, value, o) => Object.assign({ id, type: "res", a, b, value }, o);
const Di = (id, a, b, kind, o) => Object.assign({ id, type: "diode", a, b, kind }, o);
const Cd = (id, a, b, value, o) => Object.assign({ id, type: "disc", a, b, value }, o);
